name: Build WolfGym Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version/tag to publish, for example v1.0.1"
        required: true
        default: "v1.0.1"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wolfgym?schema=public
      SHADOW_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/wolfgym_shadow?schema=public
      NEXTAUTH_SECRET: wolfgym-release-build-secret
      NEXTAUTH_URL: http://127.0.0.1:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Resolve version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "WOLFGYM_VERSION=${{ github.event.inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
            "WOLFGYM_VERSION=${{ github.ref_name }}" | Out-File -FilePath $env:GITHUB_ENV -Append
          }

      - name: Build package
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File setup-launcher\build-package.ps1 -Version $env:WOLFGYM_VERSION -CreateZip -NoShortcut

      - name: Verify release
        shell: pwsh
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { throw "Production dependency audit failed" }
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\launcher-updater.ps1
          if ($LASTEXITCODE -ne 0) { throw "Updater tests failed" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.WOLFGYM_VERSION }}
          name: WolfGym ${{ env.WOLFGYM_VERSION }}
          body: |
            Paquete Windows para la prueba de distribución y actualización del launcher.
            Descarga el ZIP, extráelo completo y abre WolfGymLauncher.exe. No basta con descargar solo el ejecutable.

            La configuración privada se instala aparte en webapp/.env. Para esta prueba usa únicamente la base de aceptación; no copies credenciales al repositorio.
            Al iniciar, el launcher consulta la última versión estable, verifica el SHA-256 y conserva la configuración local al actualizar.

            Este release no activa wolf-gym.com, no aplica migraciones ni habilita cobros reales. Consulta docs/windows-release.md para los requisitos de configuración.
          files: |
            dist/WolfGym-${{ env.WOLFGYM_VERSION }}.zip
            dist/WolfGym-${{ env.WOLFGYM_VERSION }}.zip.sha256
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
